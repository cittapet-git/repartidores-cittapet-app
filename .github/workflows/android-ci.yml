name: Android CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -PMAPS_API_KEY="$MAPS_API_KEY"
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Assemble debug APK
        run: ./gradlew assembleDebug -PMAPS_API_KEY="$MAPS_API_KEY"
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Assemble release APK
        run: ./gradlew assembleRelease -PAPI_BASE_URL=https://repartidores.cittapet.app/ -PMAPS_API_KEY="$MAPS_API_KEY"
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/
